apiVersion: apps/v1
kind: Deployment
metadata:
  name: wanderlust-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: Kunika1234/wanderlust-frontend-beta:latest
        ports:
        - containerPort: 5173
        env:
        - name: VITE_BACKEND_URL
          value: http://backend-service:5000

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5173
  type: NodePort
